name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go-test-and-vet:
    name: Go Vet, Race Tests, and Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit and integration tests with race detector
        run: go test -race -count=1 ./...

      - name: Install and run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  ts-sdk:
    name: TypeScript SDK Typecheck, Build, and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install devDependencies
        run: npm ci

      - name: Typecheck SDK
        run: npm run typecheck

      - name: Build and run TypeScript tests
        run: npm test

  cli-smoke-and-docker:
    name: Release CLI Smoke and Distroless Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build static binary and run fixture gates
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/raksa-webshield ./cmd/raksa-webshield
          ./bin/raksa-webshield version
          ./bin/raksa-webshield rules --format json > rules.json
          ./bin/raksa-webshield proxy --help > /dev/null 2>&1 || true
          ./bin/raksa-webshield generate-policy --target nginx --profile strict > generated.nginx.conf
          ./bin/raksa-webshield audit-config --path generated.nginx.conf --fail-on low
          ./bin/raksa-webshield audit-headers --file testdata/headers_hardened.http --fail-on low
          ./bin/raksa-webshield audit-config --path testdata/nginx_hardened.conf --fail-on low
          ./bin/raksa-webshield inspect-request --file testdata/payload_benign.json --custom-rules examples/custom-waf-rules.yml --fail-on low

          set +e
          ./bin/raksa-webshield audit-headers --file testdata/headers_insecure.http --format sarif --fail-on critical > web.sarif
          hdr_rc=$?
          ./bin/raksa-webshield audit-config --path testdata/nginx_gixy_bugs.conf --fail-on high
          gixy_rc=$?
          ./bin/raksa-webshield audit-config --path testdata/Caddyfile --fail-on high
          caddy_rc=$?
          ./bin/raksa-webshield inspect-request --file testdata/payload_malicious.json --fail-on critical
          waf_rc=$?
          ./bin/raksa-webshield inspect-request --file testdata/payload_advanced.json --fail-on critical
          adv_rc=$?
          ./bin/raksa-webshield inspect-request --input "{ __schema { types { name } } }" --custom-rules examples/custom-waf-rules.yml --fail-on medium
          cr_rc=$?
          set -e

          test "$hdr_rc" -eq 2
          test "$gixy_rc" -eq 2
          test "$caddy_rc" -eq 2
          test "$waf_rc" -eq 2
          test "$adv_rc" -eq 2
          test "$cr_rc" -eq 2

      - name: Build and smoke-test distroless Docker image
        run: |
          docker build -t raksa-webshield:ci .
          docker run --rm raksa-webshield:ci version
          set +e
          docker run --rm -v "${{ github.workspace }}/testdata:/testdata:ro" raksa-webshield:ci audit-config --path /testdata/nginx_insecure.conf --fail-on high
          rc=$?
          set -e
          test "$rc" -eq 2
